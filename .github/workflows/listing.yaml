name: Android Listing CI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/src/main/play/listings/ja-JP/**.txt'
      - 'app/src/main/play/listings/ja-JP/graphics/**.png'

env:
  GOOGLE_PLAY_SERVICE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_JSON }}

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set publisher files
        run: echo $GOOGLE_PLAY_SERVICE_JSON | base64 -d > google-play-service.json

      - name: Run Release
        run: ./gradlew publishListing

      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "DAIgoAPP listing: ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if: always()
